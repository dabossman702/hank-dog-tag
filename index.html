<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hank - Dog ID</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .dog {
      font-size: 70px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    a {
      display: block;
      text-decoration: none;
      color: white;
      padding: 16px;
      margin: 15px 0;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .call {
      background: #28a745;
    }

    .text {
      background: #007aff;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="dog">🐕</div>

    <h1>HANK</h1>

    <p>
      Hi! If you've found me, please contact my owner.
    </p>

    <a class="call" href="tel:+15706652866">
      📞 Call Cassie
    </a>

    <a class="text" href="sms:+15706652866">
      💬 Text Cassie
    </a>
  </div>

</body>
</html>
